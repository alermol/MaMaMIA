# Reverse proxy in front of ShinyProxy (listening on 127.0.0.1:8080).
#
# Uploads and deep-linking need streaming and long timeouts. A high-resolution
# multi-BAM run can take tens of minutes; ShinyProxy stops heartbeating only
# when the browser tab closes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Larger than server.max_total_bytes and shiny.maxRequestSize in
    # deployment/start.R (5 GiB). Raise all three together.
    client_max_body_size 6g;

    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
