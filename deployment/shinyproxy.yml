# ShinyProxy configuration for MaMaMIA.
#
# Place this file at /opt/shinyproxy/application.yml (or pass it with
# --spring.config.location). The host directories under /srv/mamamia are
# expected to exist and to be read-only for the ShinyProxy user:
#
#   /srv/mamamia/config/assemblies.yml
#   /srv/mamamia/gcidx/<assembly>/index.gcrank/
#
# BAMs are uploaded by users; the container mounts no BAM directory.
#
# Mount the config and gcidx *directories*, not individual files/indexes: a
# directory mount makes new indexes visible to new sessions without rebuilding
# the image, and survives atomic replacement of assemblies.yml.
#
# See https://github.com/alermol/MaMaMIA/wiki/Deployment for the complete
# runbook. ShinyProxy serves the app directly on port 10904; no reverse proxy is
# part of this deployment.

proxy:
  title: MaMaMIA
  landing-page: /
  port: 10904

  # ShinyProxy is the public listener. Enable its LDAP/OIDC/simple
  # authentication before exposing it outside the host.
  bind-address: 0.0.0.0
  authentication: none

  # The analysis blocks the R session, so keep the container alive well past
  # the longest expected run. Heartbeats are handled by ShinyProxy itself.
  container-wait-time: 180000
  heartbeat-rate: 10000
  heartbeat-timeout: 600000
  default-proxy-max-lifetime: -1

  container-backend: docker
  docker:
    # Set to true when ShinyProxy itself runs in a container on this host.
    internal-networking: "${SHINYPROXY_INTERNAL_NETWORKING:false}"
    image-pull-policy: IfNotPresent

  container-log-path: ./container-logs

  specs:
    - id: mamamia
      display-name: MaMaMIA
      description: BAM-first introgression analysis
      container-image: mamamia:0.1.0
      container-cmd:
        - "uvr"
        - "run"
        - "/app/deployment/start.R"
      port: 3838
      container-env:
        MAMAMIA_CONFIG: /srv/mamamia/config/assemblies.yml
        # Enforce the registry upload cap in this deployment only.
        MAMAMIA_DEPLOYMENT_MODE: shinyproxy
        MAMAMIA_MAX_REQUEST_SIZE: "5368709120"
        OMP_NUM_THREADS: "1"
        R_USER_CACHE_DIR: /tmp/mamamia-cache
        HOME: /home/mamamia
      container-volumes:
        - /srv/mamamia/config:/srv/mamamia/config:ro
        - /srv/mamamia/gcidx:/srv/mamamia/gcidx:ro
        # Keep the calculation log and report timestamps in the host timezone.
        - /etc/localtime:/etc/localtime:ro
        - /etc/timezone:/etc/timezone:ro
      container-memory-limit: 16g
      container-cpu-limit: 4
      # One analysis per user; at most two 16 GB containers on the host.
      max-instances: 1
      max-total-instances: 2

# This deployment enforces the registry upload cap through
# MAMAMIA_DEPLOYMENT_MODE and MAMAMIA_MAX_REQUEST_SIZE above. A direct
# container run has no app-level upload cap. Undertow's own POST limit must be
# lifted as well.
server:
  servlet:
    session:
      timeout: 43200
  undertow:
    max-http-post-size: -1

spring:
  servlet:
    multipart:
      max-file-size: 6GB
      max-request-size: 7GB

logging:
  file:
    name: shinyproxy.log
  level:
    root: INFO
    eu.openanalytics: INFO
