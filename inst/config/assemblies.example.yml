# MaMaMIA species registry (example)
#
# The production file is mounted read-only by ShinyProxy, for example at
# /srv/mamamia/config/assemblies.yml. Relative paths are resolved against the
# directory that contains this file. Every gc_indexes entry must be a gcrank
# index directory containing contigs.tsv and manifest.json.
#
# Species have no donor/recipient role. In the application the user chooses
# one recipient species and one donor species; the same species can be used on
# either side. Contigs are paired by chromosome group, taken from the optional
# `group` field or from the first number in `name` (1A and 1R are both group
# 1). Components are arbitrary contig-set labels, not genome types. The
# dashboard analyses every declared component; `default_component` is only
# used by API calls that do not name a component explicitly. A single-component
# species may omit `component` on its contigs; it then defaults to
# `default_component`, or to "default" when no default is declared.
#
# `defaults.donor_aggregation` accepts mean, max or sum and supplies the
# dashboard default; the sidebar exposes it under Advanced.
#
# Contig lengths are read from the gcrank index, not from this file.

version: 2

defaults:
  windows_per_chromosome: 1000
  allowed_windows: [100, 1000, 10000]
  mapq: 20
  exclude_flags: 1796      # unmapped + secondary + QC-fail + duplicate
  gc_mmap: true
  gc_validate_crc: false
  donor_aggregation: max   # default; mean | max | sum, Advanced panel

server:
  max_bams: 20
  max_total_bytes: 5368709120.0   # 5 GiB

species:
  triticum_aestivum:
    label: "Triticum aestivum CS T2T"
    description: "Hexaploid wheat reference (A, B, D components)"
    default_component: A
    gc_indexes:
      - /srv/mamamia/gcidx/triticum-aestivum/index.gcrank
    contigs:
      - {id: CP155614.1, name: 1A, component: A}
      - {id: CP155613.1, name: 1B, component: B}
      - {id: CP155612.1, name: 1D, component: D}
      - {id: CP155611.1, name: 2A, component: A}
      - {id: CP155610.1, name: 2B, component: B}
      - {id: CP155609.1, name: 2D, component: D}
      - {id: CP155608.1, name: 3A, component: A}
      - {id: CP155607.1, name: 3B, component: B}
      - {id: CP155606.1, name: 3D, component: D}
      - {id: CP155605.1, name: 4A, component: A}
      - {id: CP155604.1, name: 4B, component: B}
      - {id: CP155603.1, name: 4D, component: D}
      - {id: CP155602.1, name: 5A, component: A}
      - {id: CP155601.1, name: 5B, component: B}
      - {id: CP155600.1, name: 5D, component: D}
      - {id: CP155599.1, name: 6A, component: A}
      - {id: CP155594.1, name: 6B, component: B}
      - {id: CP155598.1, name: 6D, component: D}
      - {id: CP155597.1, name: 7A, component: A}
      - {id: CP155596.1, name: 7B, component: B}
      - {id: CP155595.1, name: 7D, component: D}
  secale_cereale:
    label: "Secale cereale (rye)"
    description: "Rye reference (R component)"
    default_component: R
    gc_indexes:
      - /srv/mamamia/gcidx/secale-cereale/index.gcrank
    contigs:
      - {id: OZ284382.1, name: 1R}
      - {id: OZ284383.1, name: 2R}
      - {id: OZ284384.1, name: 3R}
      - {id: OZ284385.1, name: 4R}
      - {id: OZ284386.1, name: 5R}
      - {id: OZ284387.1, name: 6R}
      - {id: OZ284388.1, name: 7R}
  aegilops_speltoides:
    label: "Aegilops speltoides"
    description: "Wild wheat relative (S component)"
    default_component: S
    gc_indexes:
      - /srv/mamamia/gcidx/aegilops-speltoides/index.gcrank
    contigs:
      - {id: CH1S, name: 1S}
      - {id: CH2S, name: 2S}
      - {id: CH3S, name: 3S}
      - {id: CH4S, name: 4S}
      - {id: CH5S, name: 5S}
      - {id: CH6S, name: 6S}
      - {id: CH7S, name: 7S}
