# MaMaMIA species registry (example)
#
# The production file is mounted read-only by ShinyProxy, for example at
# /srv/mamamia/config/assemblies.yml. Relative paths are resolved against the
# directory that contains this file. Every gc_indexes entry must be a gcrank
# index directory containing contigs.tsv and manifest.json.
#
# Species have no donor/recipient role. In the application the user chooses
# one recipient species and one donor species; the same species can be used on
# either side. Contigs are paired by chromosome group, taken from the optional
# `group` field or from the first number in `name` (1A and 1R are both group
# 1). Set `default_subgenome` for a polyploid species so the application does
# not have to ask which subgenome to use; the user can still override it.
#
# Contig lengths are read from the gcrank index, not from this file.

version: 2

defaults:
  windows_per_chromosome: 1000
  allowed_windows: [100, 1000, 10000]
  mapq: 20
  exclude_flags: 1796      # unmapped + secondary + QC-fail + duplicate
  gc_mmap: true
  gc_validate_crc: false

server:
  max_bams: 20
  max_total_bytes: 5368709120.0   # 5 GiB

species:
  triticum_aestivum:
    label: "Triticum aestivum CS T2T"
    description: "Hexaploid wheat reference (A, B, D subgenomes)"
    default_subgenome: A
    gc_indexes:
      - /srv/mamamia/gcidx/triticum-aestivum/index.gcrank
    contigs:
      - {id: CP155614.1, name: 1A, subgenome: A}
      - {id: CP155613.1, name: 1B, subgenome: B}
      - {id: CP155612.1, name: 1D, subgenome: D}
      - {id: CP155611.1, name: 2A, subgenome: A}
      - {id: CP155610.1, name: 2B, subgenome: B}
      - {id: CP155609.1, name: 2D, subgenome: D}
      - {id: CP155608.1, name: 3A, subgenome: A}
      - {id: CP155607.1, name: 3B, subgenome: B}
      - {id: CP155606.1, name: 3D, subgenome: D}
      - {id: CP155605.1, name: 4A, subgenome: A}
      - {id: CP155604.1, name: 4B, subgenome: B}
      - {id: CP155603.1, name: 4D, subgenome: D}
      - {id: CP155602.1, name: 5A, subgenome: A}
      - {id: CP155601.1, name: 5B, subgenome: B}
      - {id: CP155600.1, name: 5D, subgenome: D}
      - {id: CP155599.1, name: 6A, subgenome: A}
      - {id: CP155594.1, name: 6B, subgenome: B}
      - {id: CP155598.1, name: 6D, subgenome: D}
      - {id: CP155597.1, name: 7A, subgenome: A}
      - {id: CP155596.1, name: 7B, subgenome: B}
      - {id: CP155595.1, name: 7D, subgenome: D}
  secale_cereale:
    label: "Secale cereale (rye)"
    description: "Rye reference (R subgenome)"
    default_subgenome: R
    gc_indexes:
      - /srv/mamamia/gcidx/secale-cereale/index.gcrank
    contigs:
      - {id: OZ284382.1, name: 1R, subgenome: R}
      - {id: OZ284383.1, name: 2R, subgenome: R}
      - {id: OZ284384.1, name: 3R, subgenome: R}
      - {id: OZ284385.1, name: 4R, subgenome: R}
      - {id: OZ284386.1, name: 5R, subgenome: R}
      - {id: OZ284387.1, name: 6R, subgenome: R}
      - {id: OZ284388.1, name: 7R, subgenome: R}
  aegilops_speltoides:
    label: "Aegilops speltoides"
    description: "Wild wheat relative (S subgenome)"
    default_subgenome: S
    gc_indexes:
      - /srv/mamamia/gcidx/aegilops-speltoides/index.gcrank
    contigs:
      - {id: CH1S, name: 1S, subgenome: S, group: 1}
      - {id: CH2S, name: 2S, subgenome: S, group: 2}
      - {id: CH3S, name: 3S, subgenome: S, group: 3}
      - {id: CH4S, name: 4S, subgenome: S, group: 4}
      - {id: CH5S, name: 5S, subgenome: S, group: 5}
      - {id: CH6S, name: 6S, subgenome: S, group: 6}
      - {id: CH7S, name: 7S, subgenome: S, group: 7}
