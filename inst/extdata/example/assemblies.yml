version: 2
defaults:
  windows_per_chromosome: 1000
  allowed_windows:
  - 1000
  mapq: 20
  exclude_flags: 1796
  gc_mmap: true
  gc_validate_crc: false
server:
  max_bams: 4
  max_total_bytes: 2.097152e+07
species:
  triticum_like:
    label: Triticum-like (A)
    description: Synthetic 160-260 kb chromosomes with variable GC
    default_component: A
    gc_indexes:
    - demo.gcrank
    contigs:
    - id: r1
      name: 1A
    - id: r2
      name: 2A
    - id: r3
      name: 3A
    - id: r4
      name: 4A
  secale_like:
    label: Secale-like (R)
    description: Synthetic 160-260 kb chromosomes with variable GC
    default_component: R
    gc_indexes:
    - demo.gcrank
    contigs:
    - id: d1
      name: 1R
    - id: d2
      name: 2R
    - id: d3
      name: 3R
    - id: d4
      name: 4R
