version: 2
defaults:
  windows_per_chromosome: 100
  allowed_windows:
  - 100
  - 1000
  mapq: 20
  exclude_flags: 1796
  gc_mmap: true
  gc_validate_crc: false
server:
  max_bams: 4
  max_total_bytes: 2.097152e+07
species:
  triticum_like:
    label: Triticum-like (A)
    description: Synthetic 20 kb contig with variable GC
    default_component: A
    gc_indexes:
    - demo.gcrank
    contigs:
    - id: r1
      name: 1A
      component: A
  secale_like:
    label: Secale-like (R)
    description: Synthetic 20 kb contig with variable GC
    default_component: R
    gc_indexes:
    - demo.gcrank
    contigs:
    - id: d1
      name: 1R
      component: R
