version: 2
defaults:
  windows_per_chromosome: 100
  allowed_windows:
  - 100
  - 1000
  - 10000
  mapq: 20
  exclude_flags: 1796
  gc_mmap: true
  gc_validate_crc: false
server:
  max_bams: 4
  max_total_bytes: 1048576.0
species:
  tiny_recipient:
    label: Tiny synthetic recipient
    description: Two 20 kb contigs with 40% and 60% GC
    default_component: R
    gc_indexes:
    - tiny.gcrank
    contigs:
    - id: r1
      name: 1R
  tiny_donor:
    label: Tiny synthetic donor
    description: Two 20 kb contigs with 40% and 60% GC
    default_component: D
    gc_indexes:
    - tiny.gcrank
    contigs:
    - id: d1
      name: 1D
