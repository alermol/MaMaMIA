[project]
name = "MaMaMIA"
r_version = "4.6.1"
description = "Max Mapping for Meticulous Introgression Analysis"

[dependencies]
DNAcopy = { bioc = true }
GenomicRanges = { bioc = true, version = ">=1.64.0" }
IRanges = { bioc = true, version = ">=2.46.0" }
Rcpp = ">=1.1.2"
Rhtslib = { bioc = true, version = ">=3.8.0" }
ggplot2 = ">=4.0.3"
jsonlite = ">=2.0.0"
parallel = "*"
rlang = ">=1.3.0"
splines = "*"
stats = "*"
tools = "*"
utils = "*"
