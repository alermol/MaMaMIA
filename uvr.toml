[dev-dependencies]
DT = "*"
bslib = "*"
gridlayout = { git = "rstudio/gridlayout" }
htmltools = "*"
knitr = ">=1.51"
rmarkdown = ">=2.31"
roxygen2 = "*"
shiny = "*"
shinyWidgets = "*"
testthat = ">=3.0.0"
